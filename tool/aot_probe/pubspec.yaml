name: ispect_aot_probe
description: Program that `ispect_tool aot-probe` compiles with and without ISPECT_ENABLED.
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  bloc: ^9.1.0
  dio: ^5.8.0+1
  http: ^1.5.0
  ispectify:
    path: ../../packages/ispectify
  ispectify_bloc:
    path: ../../packages/ispectify_bloc
  ispectify_db:
    path: ../../packages/ispectify_db
  ispectify_dio:
    path: ../../packages/ispectify_dio
  ispectify_http:
    path: ../../packages/ispectify_http
  ispectify_riverpod:
    path: ../../packages/ispectify_riverpod
  ispectify_ws:
    path: ../../packages/ispectify_ws
  riverpod: ^2.5.0

dependency_overrides:
  ispectify:
    path: ../../packages/ispectify
