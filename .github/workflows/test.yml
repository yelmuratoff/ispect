name: Test & Analyze

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  # Pure Dart packages (no Flutter dependency)
  test-dart:
    name: "Test Dart packages"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ispectify
          - ispectify_db

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter test runner
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.32.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd packages/${{ matrix.package }}
          dart pub get --no-example

      - name: Analyze
        run: |
          cd packages/${{ matrix.package }}
          dart analyze --fatal-infos

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          flutter test --dart-define=ISPECT_ENABLED=true --coverage

      - name: Verify disabled production API
        if: hashFiles(format('packages/{0}/test/production_safety_test.dart', matrix.package)) != ''
        run: |
          cd packages/${{ matrix.package }}
          dart test --run-skipped test/production_safety_test.dart

      - name: Convert coverage to lcov
        if: always()
        run: |
          cd packages/${{ matrix.package }}
          if [[ -s coverage/lcov.info ]]; then
            exit 0
          fi
          if ! find coverage -type f \( -name '*.vm.json' -o -name '*.json' \) -print -quit | grep -q .; then
            echo "::warning::No coverage data found in packages/${{ matrix.package }}/coverage — skipping lcov conversion."
            mkdir -p coverage
            : > coverage/lcov.info
            exit 0
          fi
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib \
            --packages=.dart_tool/package_config.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-dart-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Flutter packages
  test-flutter:
    name: "Test Flutter packages (${{ matrix.flutter.version }}, ${{ matrix.flutter.channel_signal }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.flutter.channel_signal == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - ispect
          - ispect_layout
          - ispectify_dio
          - ispectify_http
          - ispectify_ws
          - ispectify_bloc
          - ispectify_riverpod
        flutter:
          - version: "3.32.6"
            channel_signal: required
          - version: "stable"
            channel_signal: advisory

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned ${{ matrix.flutter.version }})
        if: matrix.flutter.version != 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: stable
          cache: true

      - name: Setup Flutter (latest stable)
        if: matrix.flutter.version == 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd packages/${{ matrix.package }}
          flutter pub get

      - name: Analyze
        run: |
          cd packages/${{ matrix.package }}
          flutter analyze --fatal-infos

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          flutter test --dart-define=ISPECT_ENABLED=true --coverage

      - name: Verify disabled production API
        if: matrix.flutter.version == '3.32.6' && hashFiles(format('packages/{0}/test/production_safety_test.dart', matrix.package)) != ''
        run: |
          cd packages/${{ matrix.package }}
          flutter test --run-skipped test/production_safety_test.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-flutter-${{ matrix.package }}-${{ matrix.flutter.version }}
          path: packages/${{ matrix.package }}/coverage/lcov.info

      - name: Upload to Codecov
        if: always() && matrix.flutter.version == '3.32.6'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
