name: Test & Analyze

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "ispect_devtools_extension/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "ispect_devtools_extension/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  # The pinned Flutter does not deprecate package:flutter/material.dart yet,
  # so the required analyze step would let it back in.
  material-imports:
    name: "No framework Material imports"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check imports
        run: |
          if git grep -nE "package:flutter/(material|cupertino)\.dart" -- 'packages/*.dart' 'web_logs_viewer/*.dart' 'ispect_devtools_extension/*.dart' ':!packages/ispectify_db/example/**'; then
            echo "::error::Import Material from package:material_ui and Cupertino from package:cupertino_ui."
            exit 1
          fi

  # Pure Dart packages (no Flutter dependency)
  test-dart:
    name: "Test Dart packages"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ispectify
          - ispectify_db

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter test runner
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd packages/${{ matrix.package }}
          dart pub get --no-example

      - name: Analyze
        run: |
          cd packages/${{ matrix.package }}
          dart analyze --fatal-infos

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          flutter test --no-pub --dart-define=ISPECT_ENABLED=true --coverage

      - name: Verify disabled production API
        if: hashFiles(format('packages/{0}/test/production_safety_test.dart', matrix.package)) != ''
        run: |
          cd packages/${{ matrix.package }}
          dart test --run-skipped test/production_safety_test.dart

      - name: Convert coverage to lcov
        if: always()
        run: |
          cd packages/${{ matrix.package }}
          if [[ -s coverage/lcov.info ]]; then
            exit 0
          fi
          if ! find coverage -type f \( -name '*.vm.json' -o -name '*.json' \) -print -quit | grep -q .; then
            echo "::warning::No coverage data found in packages/${{ matrix.package }}/coverage - skipping lcov conversion."
            mkdir -p coverage
            : > coverage/lcov.info
            exit 0
          fi
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib \
            --packages=.dart_tool/package_config.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dart-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Flutter packages
  test-flutter:
    name: "Test Flutter packages (${{ matrix.flutter.version }}, ${{ matrix.flutter.channel_signal }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.flutter.channel_signal == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - ispect
          - ispect_layout
          - ispectify_dio
          - ispectify_http
          - ispectify_ws
          - ispectify_bloc
          - ispectify_riverpod
        flutter:
          - version: "3.47.5"
            channel_signal: required
          - version: "stable"
            channel_signal: advisory

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned ${{ matrix.flutter.version }})
        if: matrix.flutter.version != 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: stable
          cache: true

      - name: Setup Flutter (latest stable)
        if: matrix.flutter.version == 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd packages/${{ matrix.package }}
          flutter pub get

      - name: Analyze
        run: |
          cd packages/${{ matrix.package }}
          flutter analyze --fatal-infos

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          flutter test --dart-define=ISPECT_ENABLED=true --coverage

      - name: Verify disabled production API
        if: matrix.flutter.channel_signal == 'required' && hashFiles(format('packages/{0}/test/production_safety_test.dart', matrix.package)) != ''
        run: |
          cd packages/${{ matrix.package }}
          flutter test --run-skipped test/production_safety_test.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-flutter-${{ matrix.package }}-${{ matrix.flutter.version }}
          path: packages/${{ matrix.package }}/coverage/lcov.info

      - name: Upload to Codecov
        if: always() && matrix.flutter.version == '3.47.5'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The DevTools tab that ispect_devtools ships, built the way publishing builds it.
  test-devtools-extension:
    name: "Test the DevTools extension"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned 3.47.5)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd ispect_devtools_extension
          flutter pub get

      - name: Analyze
        run: |
          cd ispect_devtools_extension
          flutter analyze --fatal-infos

      - name: Run tests
        run: |
          cd ispect_devtools_extension
          flutter test --dart-define=ISPECT_ENABLED=true

      - name: Build and validate the extension
        run: |
          dart pub get --directory tool
          dart run tool/bin/ispect_tool.dart devtools-extension
          cd ispect_devtools_extension
          dart run devtools_extensions validate --package=../packages/ispect_devtools
