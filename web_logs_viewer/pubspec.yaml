name: web_logs_viewer
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependency_overrides:
  ispect:
    path: ../packages/ispect
  ispect_layout:
    path: ../packages/ispect_layout
  ispectify:
    path: ../packages/ispectify
  ispectify_http:
    path: ../packages/ispectify_http
  ispectify_bloc:
    path: ../packages/ispectify_bloc
  ispectify_dio:
    path: ../packages/ispectify_dio
  ispectify_ws:
    path: ../packages/ispectify_ws
  ispectify_db:
    path: ../packages/ispectify_db
  # TODO(yelmuratoff): drop once draggable_panel 5.0.0 is on pub.dev,
  # https://github.com/yelmuratoff/draggable_panel/pull/1
  draggable_panel:
    git:
      url: https://github.com/yelmuratoff/draggable_panel.git
      ref: 37bc38991dbd1ec375765329e183ddd8a3f0d1bf

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ispect: ^8.0.0-dev.1
  ispectify: ^8.0.0-dev.1
  ispectify_dio: ^8.0.0-dev.1
  ispectify_http: ^8.0.0-dev.1
  ispectify_bloc: ^8.0.0-dev.1
  ispectify_ws: ^8.0.0-dev.1
  ispectify_db: ^8.0.0-dev.1

  iconsax_plus: ^1.0.0

  file_picker: ^11.0.3
  super_drag_and_drop: ^0.9.1
  collection: ^1.19.1
  dio: ^5.11.1
  ws: ^1.0.0
  http: ^1.6.0
  flutter_bloc: ^9.1.0
  http_interceptor: ^3.0.0
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
