name: web_logs_viewer
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependency_overrides:
  ispect:
    path: ../packages/ispect
  ispect_layout:
    path: ../packages/ispect_layout
  ispectify:
    path: ../packages/ispectify
  ispectify_http:
    path: ../packages/ispectify_http
  ispectify_bloc:
    path: ../packages/ispectify_bloc
  ispectify_dio:
    path: ../packages/ispectify_dio
  ispectify_ws:
    path: ../packages/ispectify_ws
  ispectify_db:
    path: ../packages/ispectify_db

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ispect: ^7.0.0
  ispectify: ^7.0.0
  ispectify_dio: ^7.0.0
  ispectify_http: ^7.0.0
  ispectify_bloc: ^7.0.0
  ispectify_ws: ^7.0.0
  ispectify_db: ^7.0.0

  iconsax_plus: ^1.0.0

  file_picker: ^11.0.3
  super_drag_and_drop: ^0.9.1
  collection: ^1.19.1
  dio: ^5.11.1
  ws: ^1.0.0
  http: ^1.6.0
  flutter_bloc: ^9.1.0
  http_interceptor: ^3.0.0
  share_plus: ^12.0.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
