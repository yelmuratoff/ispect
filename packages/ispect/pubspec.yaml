name: ispect
description: In-app observability and QA diagnostics toolkit for Flutter, with logs, network tracing, layout inspection, exports, and redaction.
version: 8.0.0-dev.2
homepage: https://github.com/yelmuratoff/ispect
repository: https://github.com/yelmuratoff/ispect
issue_tracker: https://github.com/yelmuratoff/ispect/issues

topics:
  - inspector
  - ispect
  - debug
  - toolkit
  - debug-toolkit

screenshots:
  - description: "A network response opened as JSON, the widget inspector on a Paragraph, and the floating ISpect panel, all inside the running app."
    path: assets/screenshots/banner.webp

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.47.0"

dependency_overrides:
  ispectify:
    path: ../ispectify
  ispect_layout:
    path: ../ispect_layout

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  flutter_localizations:
    sdk: flutter
  meta: ^1.16.0
  collection: ^1.19.1

  # Logging
  ispectify: ^8.0.0-dev.2

  # Utils
  path_provider: ^2.1.5
  web: ^1.1.1

  # UI
  ispect_layout: ^8.0.0-dev.2
  draggable_panel: ^5.0.0
  super_sliver_list: ^0.4.1
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
